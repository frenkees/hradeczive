# Sběr typické dopravy z HERE (přes veřejnou funkci /api/doprava): každých 30 min přičte snímek do histogramu hodin.
# Data jsou ve větvi doprava-data (agg.json, typicka.json), vždy jediný commit (přepisuje se), historie nenarůstá.
name: doprava-sber
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: doprava-sber
  cancel-in-progress: false
jobs:
  sber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Data z větve doprava-data
        run: |
          if git ls-remote --exit-code --heads origin doprava-data >/dev/null 2>&1; then
            git fetch --depth=1 origin doprava-data
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snímek
        run: node skripty/doprava_sber.mjs data "${DOPRAVA_URL:-https://hradeczive.cz/api/doprava}"
        env:
          DOPRAVA_URL: ${{ vars.DOPRAVA_URL }}
      - name: Uložit do větve doprava-data (jediný commit)
        run: |
          cd data
          [ -f agg.json ] || { echo "žádná data k uložení"; exit 0; }
          rm -rf .git; git init -q -b doprava-data
          git config user.name "doprava-sber"; git config user.email "doprava-sber@users.noreply.github.com"
          git add agg.json typicka.json
          git commit -q -m "Agregace dopravy HERE ($(date -u +%FT%TZ))"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" doprava-data
